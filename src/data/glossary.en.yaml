  Plataforma: Platform
  Rol: Role
  Evento: Event

entries:
  - term: SO
    fullName: Segundas Oportunidades (Second Chances)
    category: Programa
    definition: >
      Program dedicated to giving a second chance to animals that have been
      abandoned or mistreated. Volunteers participate in socialization
      activities, walks, and care for these animals.

  - term: ASS
    fullName: Animals Sense Sostre (Animals Without Shelter)
    category: Organización
    definition: >
      Partner organization that works with homeless animals. Fundación Patas
      Arriba coordinates volunteers to support their activities and adoption
      events.

  - term: Evento
    fullName: Event
    category: Plataforma
    definition: >
      An activity organized by the foundation where volunteers can
      participate. Each event has a date, location, and a maximum number of
      available spots.

  - term: Grupo de Coches
    fullName: Car Group
    category: Plataforma
    definition: >
      A system to coordinate shared transportation between volunteers
      attending the same event. A driver creates a group indicating available
      seats and other volunteers can join.

  - term: Organizador
    fullName: Organizer
    category: Rol
    definition: >
      A volunteer with special permissions to create and manage events,
      activate new users, and view the full list of registered volunteers.

  - term: Admin
    fullName: Administrator
    category: Rol
    definition: >
      The highest permission level on the platform. Can manage all aspects of
      the system, including promoting users to organizers.

  - term: Activación
    fullName: Activation
    category: Plataforma
    definition: >
      The process by which an organizer or admin approves a new volunteer's
      account. Until activated, the user cannot view or join events.

  - term: Acogida
    fullName: Foster Care
    category: Programa
    definition: >
      A program where a volunteer temporarily cares for an animal in their
      home until a permanent adoptive family is found.

  - term: Apadrinamiento
    fullName: Sponsorship
    category: Programa
    definition: >
      A volunteer's commitment to regularly contribute financially or with
      their time to the care of a specific animal at the shelter.

  - term: Jornada de Adopción
    fullName: Adoption Day
    category: Evento
    definition: >
      A special event where animals available for adoption are presented to
      the public. Volunteers help with logistics, public assistance, and
      animal care during the event.

  - term: Colonia Felina
    fullName: Feral Cat Colony
    category: Programa
    definition: >
      A group of stray cats managed through the TNR (Trap, Neuter, Return)
      method. Volunteers feed and monitor the health of the cats in the
      colony.

  - term: CES
    fullName: Captura, Esterilización, Suelta (Trap, Neuter, Return / TNR)
    category: Programa
    definition: >
      An ethical method for controlling stray cat populations. The animal is
      captured, neutered at a veterinary clinic, and returned to its original
      colony.
